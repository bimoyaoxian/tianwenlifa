<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字排盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Times New Roman","宋体",serif;background:#e8e0d0;color:#000;font-size:16px}
a{color:#000;text-decoration:underline}
#top_box{padding:12px 20px;max-width:1100px;margin:0 auto}
.otherLinks{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.otherLinks .homePage a{font-size:24px;font-weight:bold;color:#000;text-decoration:none;letter-spacing:6px}
.otherLinks>div a{font-size:15px;color:#000;text-decoration:none}
.otherLinks>div a:hover{text-decoration:underline;color:#400}
.otherLinks .nav-active a{font-weight:bold;color:#600!important}
.container{max-width:850px;margin:10px auto;padding:0 20px}
.bordered{border:1px solid #999;padding:16px;margin-bottom:12px}
.form-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.form-group{flex:1;min-width:90px}
.form-group label{display:block;font-size:13px;margin-bottom:2px;color:#444}
.form-group input,.form-group select{width:100%;padding:4px 6px;border:1px solid #888;font-size:14px;background:#f8f0e4}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#400;background:#fff}
.system-select{display:flex;gap:4px;margin-bottom:10px}
.system-select button{padding:4px 12px;border:1px solid #888;background:#f0e8d8;cursor:pointer;font-size:13px}
.system-select button:hover{background:#e0d8c8}
.system-select button.active{background:#c0b8a8;font-weight:bold}
.btn{padding:6px 30px;border:1px solid #888;background:#f0e8d8;cursor:pointer;font-size:15px;letter-spacing:4px}
.btn:hover{background:#e0d8c8}
.result-area{margin-top:12px}
.result-area.hidden{display:none}
.loading{padding:20px;color:#666;text-align:center}
table{border-collapse:collapse;width:100%;margin-top:6px;font-size:13px}
th,td{padding:5px 8px;text-align:center;border:1px solid #bbb}
th{background:#f0e8d8;font-weight:normal}
.pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.pillar-box{text-align:center;padding:10px;border:1px solid #bbb;background:#f8f4ec}
.pillar-box .title{font-size:11px;color:#666}
.pillar-box .gz{font-size:22px;font-weight:bold;letter-spacing:4px}
.pillar-box .ny{font-size:11px;color:#666}
.pillar-box .ss{font-size:11px;color:#484}
.pillar-box.highlight{border-color:#800}
.pillar-box.highlight .gz{color:#800}
.info-section{border:1px solid #bbb;padding:10px 12px;margin:8px 0;background:#f8f4ec}
.info-section h3{font-size:13px;margin-bottom:6px;border-bottom:1px solid #ddd;padding-bottom:4px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:3px}
.info-item{padding:2px 6px;font-size:12px}
.info-item .lb{color:#666}
.info-item .vl{color:#000}
.dayun-table{font-size:12px}
.dayun-table td{color:#000}
.dayun-table .dy{font-weight:bold;color:#800}
@media(max-width:600px){.pillar-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="top_box">
<div class="otherLinks">
<div class="homePage"><a href="/">天文历算</a></div>
<div><a href="/">天文历算</a></div>
<div><a href="/luojia">落甲日历</a></div>
<div class="nav-active"><a href="/bazi">八字排盘</a></div>
<div><a href="/tools">观天察时</a></div>
</div>
</div>

<div class="container">
<div class="bordered">
<div class="system-select">
<button class="active" onclick="switchSys(0)">落甲历</button>
<button onclick="switchSys(1)">标准历法</button>
</div>
<form onsubmit="return false">
<div class="form-row">
<div class="form-group"><label>姓名</label><input id="name" value="命主"></div>
<div class="form-group"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
<div class="form-group"><label>年</label><input type="number" id="year" min="1900" max="2100"></div>
<div class="form-group"><label>月</label><input type="number" id="month" min="1" max="12"></div>
<div class="form-group"><label>日</label><input type="number" id="day" min="1" max="31"></div>
<div class="form-group"><label>时</label>
<select id="hour">
<option value="">未知时辰</option>
<option value="23">夜子 23-1</option><option value="0">早子 0-1</option>
<option value="1">丑初 1-2</option><option value="2">丑正 2-3</option>
<option value="3">寅初 3-4</option><option value="4">寅正 4-5</option>
<option value="5">卯初 5-6</option><option value="6">卯正 6-7</option>
<option value="7">辰初 7-8</option><option value="8">辰正 8-9</option>
<option value="9">巳初 9-10</option><option value="10">巳正 10-11</option>
<option value="11">午初 11-12</option><option value="12">午正 12-13</option>
<option value="13">未初 13-14</option><option value="14">未正 14-15</option>
<option value="15">申初 15-16</option><option value="16">申正 16-17</option>
<option value="17">酉初 17-18</option><option value="18">酉正 18-19</option>
<option value="19">戌初 19-20</option><option value="20">戌正 20-21</option>
<option value="21">亥初 21-22</option><option value="22">亥正 22-23</option>
</select></div></div>
<div class="form-row">
<div class="form-group" style="flex:2"><label>出生地 (用于真太阳时)</label>
<select id="city" onchange="cityChange()">
<option value="">-- 手动输入 --</option>
{% for key, name in cities.items() %}{% if key %}
<option value="{{ key }}">{{ name }}</option>{% endif %}{% endfor %}
</select></div>
<div class="form-group"><label>东经</label><input type="number" id="longitude" step="0.1"></div>
</div>
</form>
<div style="text-align:center;margin-top:8px"><button class="btn" onclick="calc()">开始排盘</button></div>
</div>

<div id="resultArea" class="result-area hidden">
<div id="resultContent"></div>
<div style="text-align:center;margin-top:10px;display:flex;gap:8px;justify-content:center">
<button class="btn" id="copyBtn" style="font-size:12px;letter-spacing:2px;padding:4px 16px" onclick="copyPrompt()">📋 一键复制 (AI提示词)</button>
<button class="btn" id="copyLunarBtn" style="font-size:12px;letter-spacing:2px;padding:4px 16px" onclick="copyLunarPrompt()">📋 复制紫薇农历</button>
</div>
</div>
</div>

<script>
const cityLons={{city_lons|safe}};
let sys='luojia';
let lastResult=null;
function switchSys(n){sys=n?'standard':'luojia';document.querySelectorAll('.system-select button').forEach((b,i)=>b.className=i===n?'active':'')}
function cityChange(){const k=document.getElementById('city').value;if(k&&cityLons[k])document.getElementById('longitude').value=cityLons[k]}
document.addEventListener('DOMContentLoaded',()=>{const n=new Date();document.getElementById('year').value=n.getFullYear();document.getElementById('month').value=n.getMonth()+1;document.getElementById('day').value=n.getDate()});

async function calc(){
const hVal=document.getElementById('hour').value;
const d={year:parseInt(document.getElementById('year').value),month:parseInt(document.getElementById('month').value),day:parseInt(document.getElementById('day').value),
hour:hVal===''?null:parseInt(hVal),minute:0,gender:document.getElementById('gender').value,system:sys,longitude:document.getElementById('longitude').value||null};
document.getElementById('resultArea').classList.remove('hidden');
document.getElementById('resultContent').innerHTML='<div class="loading">计算中...</div>';
try{
const r=await fetch('/api/bazi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
const res=await r.json();lastResult=res;render(res);
}catch(e){document.getElementById('resultContent').innerHTML='<div style="color:#c00;padding:20px">失败: '+e.message+'</div>'}
}

function render(r){
const hourUnknown=r.input_info.hour===null;
const hourDisplay=hourUnknown?'未知':String(r.input_info.hour).padStart(2,'0');
let html=`
<div style="font-size:12px;color:#666;margin-bottom:6px">【${r.system_name||''}】${r.input_info.year}年${r.input_info.month}月${r.input_info.day}日 ${hourDisplay}:00 ${r.input_info.gender}</div>
<div class="pillar-grid">
<div class="pillar-box"><div class="title">年柱</div><div class="gz">${r.year_pillar||''}</div><div class="ny">${r.year_nayin||''}</div><div class="ss">${r.year_shi_shen||''}</div></div>
<div class="pillar-box"><div class="title">月柱</div><div class="gz">${r.month_pillar||''}</div><div class="ny">${r.month_nayin||''}</div><div class="ss">${r.month_shi_shen||''}</div></div>
<div class="pillar-box highlight"><div class="title">日柱</div><div class="gz">${r.day_pillar||''}</div><div class="ny">${r.day_nayin||''}</div><div class="ss">${r.day_shi_shen||''}</div></div>
<div class="pillar-box"><div class="title">时柱</div><div class="gz">${hourUnknown?'* * * *':r.hour_pillar||''}</div><div class="ny">${hourUnknown?'时辰未知':r.hour_nayin||''}</div><div class="ss">${hourUnknown?'*':r.hour_shi_shen||''}</div></div></div>`;

if(r.year_cang_gan){
html+=`<div class="info-section"><h3>藏干</h3><div class="info-grid">`;
['year','month','day','hour'].forEach(p=>{
html+=`<div class="info-item"><span class="lb">${r[p+'_zhi']||''}支</span><span class="vl">${(r[p+'_cang_gan']||[]).map((g,i)=>g+(r[p+'_cang_gan_shi_shen']?'('+r[p+'_cang_gan_shi_shen'][i]+')':'')).join(' ')}</span></div>`;
});
html+=`</div></div>`;
}

html+=`<div class="info-section"><h3>命盘信息</h3><div class="info-grid">
<div class="info-item"><span class="lb">生肖</span><span class="vl">${r.sheng_xiao||''}</span></div>
<div class="info-item"><span class="lb">日空</span><span class="vl">${r.ri_kong||''}</span></div>
<div class="info-item"><span class="lb">胎元</span><span class="vl">${r.tai_yuan||''} ${r.tai_yuan_nayin||''}</span></div>
<div class="info-item"><span class="lb">命宫</span><span class="vl">${r.ming_gong||''} ${r.ming_gong_nayin||''}</span></div>
<div class="info-item"><span class="lb">身宫</span><span class="vl">${r.shen_gong||''} ${r.shen_gong_nayin||''}</span></div>
<div class="info-item"><span class="lb">大运</span><span class="vl" style="font-weight:bold;color:${r.forward_dayun?'#060':'#800'}">${r.forward_dayun?'顺排':'逆排'}</span></div>
<div class="info-item"><span class="lb">交运</span><span class="vl">${r.jiao_yun_date||''}</span></div>
<div class="info-item"><span class="lb">起运</span><span class="vl">${r.qi_yun_info||''}</span></div>
</div></div>`;

if(r.dayun_list&&r.dayun_list.length){
html+=`<div class="info-section"><h3>大运 (${r.forward_dayun?'阳男阴女·顺排':'阴男阳女·逆排'})</h3>
<table class="dayun-table"><thead><tr><th>大运</th><th>纳音</th><th>十神</th><th>年龄</th><th>起止日期</th></tr></thead><tbody>`;
r.dayun_list.forEach((dy,di)=>{
const ln=r.liunian_list&&r.liunian_list[di]?r.liunian_list[di]:[];
html+=`<tr style="cursor:pointer" onclick="toggleLn(${di})"><td class="dy">${dy.ganzhi}</td><td>${dy.nayin||''}</td><td>${dy.shi_shen||''}</td><td>${dy.age_start}~${dy.age_end-1}岁</td><td>${dy.start_date} ~ ${dy.end_date}</td></tr>`;
html+=`<tr id="ln-${di}" style="display:none"><td colspan="5" style="padding:0"><table style="width:100%;font-size:11px"><thead><tr style="background:#f0e8d8"><th>流年</th><th>十神</th><th>日期</th><th></th></tr></thead><tbody>`;
ln.forEach((ly,li)=>{
const ym=ly.liuyue||[];
html+=`<tr style="cursor:pointer" onclick="toggleLy(${di},${li})"><td>${ly.ganzhi} (${ly.year})</td><td>${ly.shi_shen||''}</td><td>${ly.start_date} ~ ${ly.end_date}</td><td>▶</td></tr>`;
html+=`<tr id="ly-${di}-${li}" style="display:none"><td colspan="4" style="padding:2px"><table style="width:100%;font-size:10px;background:#f8f4ec"><thead><tr><th>流月</th><th>十神</th><th>起</th><th>止</th></tr></thead><tbody>`;
ym.forEach(my=>{
html+=`<tr><td>${my.ganzhi}</td><td>${my.shi_shen||''}</td><td>${my.start_date}</td><td>${my.end_date}</td></tr>`;
});
html+=`</tbody></table></td></tr>`;
});
html+=`</tbody></table></td></tr>`;
});
html+=`</tbody></table></div>`;
}

document.getElementById('resultContent').innerHTML=html;
document.getElementById('resultContent').scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleLn(di){
const el=document.getElementById('ln-'+di);
if(el)el.style.display=el.style.display==='none'?'':'none';
}
function toggleLy(di,li){
const el=document.getElementById('ly-'+di+'-'+li);
if(el)el.style.display=el.style.display==='none'?'':'none';
}
function copyLunarPrompt(){
const r=lastResult;if(!r)return;
if(r.input_info.hour===null){alert('不支持没有时柱的八字，请先确定出生时辰后再复制。');return;}
if(!r.lunar_month||!r.lunar_day){console.error('缺少农历月日字段',r);alert('数据异常：缺少农历月日，请重新排盘');return;}
const diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const h=r.input_info.hour;
const shiChen=diZhi[((h+1)/2>>0)%12];
let txt=r.year_pillar+'　农历'+r.lunar_month+'月'+r.lunar_day+'　'+shiChen+'时';
navigator.clipboard.writeText(txt).then(()=>{
const btn=document.getElementById('copyLunarBtn');
const old=btn.textContent;btn.textContent='✅ 已复制';btn.style.borderColor='#060';btn.style.color='#060';
setTimeout(()=>{btn.textContent=old;btn.style.borderColor='';btn.style.color='';},2000);
}).catch(()=>alert('复制失败，请手动选择复制'));
}
function copyPrompt(){
const r=lastResult;if(!r)return;
const g=r.input_info.gender;
const by=r.input_info.year,bm=r.input_info.month,bd=r.input_info.day,bh=r.input_info.hour;
const now=new Date();
const cy=now.getFullYear(),cm=now.getMonth()+1,cd=now.getDate();
const age=cy-by;

// 大运全部输出，每个大运下面列出所有流年
let dyLines='',curDi=-1;
(r.dayun_list||[]).forEach((d,i)=>{
  const aS=d.age_start,aE=d.age_end-1;
  const isCur=(age>=aS&&age<=aE);
  if(isCur)curDi=i;
  dyLines+=(i+1)+'. '+d.ganzhi+'（'+aS+'~'+aE+'岁）'+'　'+d.start_date+' ~ '+d.end_date+(isCur?' ←当前大运':'')+'\n';
  // 列出该大运内的所有流年（含公历日期校准）
  const lns=r.liunian_list&&r.liunian_list[i];
  if(lns&&lns.length){
    const curYearLns=lns.map(l=>{
      const mark=(isCur&&l.year===cy)?' ←当前流年':'';
      return l.ganzhi+'('+l.year+')'+l.start_date+'~'+l.end_date+mark;
    });
    dyLines+='  　流年：'+curYearLns.join('、')+'\n';
  }
});

// 当前流年（单独拎出来）
let curLn=null;
if(r.liunian_list&&curDi>=0){
  const lns=r.liunian_list[curDi];
  if(lns)curLn=lns.find(l=>l.year===cy);
}
let curLnTxt='';
let curLyTxt='';
if(curLn){
  curLnTxt=curLn.ganzhi+'（'+cy+'年）'+curLn.start_date+' ~ '+curLn.end_date;
  // 当前流月（用日期字符串直接比较，避免时区偏差）
  const todayStr=cy+'-'+String(cm).padStart(2,'0')+'-'+String(cd).padStart(2,'0');
  const curLy=curLn.liuyue.find(m=>todayStr>=m.start_date&&todayStr<=m.end_date);
  if(curLy)curLyTxt=curLy.ganzhi+'月　'+curLy.start_date+' ~ '+curLy.end_date;
  else curLyTxt=cm+'月（不在流月范围内）';
  // 后续流月
  let nextLyTxt='';
  let found=false;
  curLn.liuyue.forEach(m=>{
    if(m.ganzhi===(curLy?curLy.ganzhi:null)&&!found){found=true;return;}
    if(found)nextLyTxt+='\n  后续：'+m.ganzhi+'月　'+m.start_date+' ~ '+m.end_date;
  });
  if(nextLyTxt)curLyTxt+=nextLyTxt;
}else{
  curLnTxt=cy+'年'+cm+'月'+cd+'日';
}

const hourUnknown=(bh===null);
const birthTimeStr=hourUnknown?'时辰未知':String(bh).padStart(2,'0')+':00';
const pillarStr=hourUnknown
  ? r.year_pillar+' '+r.month_pillar+' '+r.day_pillar+' 时辰未知'
  : r.year_pillar+' '+r.month_pillar+' '+r.day_pillar+' '+r.hour_pillar;
const nayinStr=hourUnknown
  ? (r.year_nayin||'')+' '+(r.month_nayin||'')+' '+(r.day_nayin||'')+' (时辰未知)'
  : (r.year_nayin||'')+' '+(r.month_nayin||'')+' '+(r.day_nayin||'')+' '+(r.hour_nayin||'');

let txt='你是一名资深命理师，请根据以下内容，合理分析八字。\n\n';
txt+='注意：以下八字排盘使用的是落甲历（岁星天文历法），以岁星(木星)运行为依据，\n';
txt+='每个流年为一个落甲历年（约360天周期），并非公历自然年或节气年。\n';
txt+='请按此天文历法体系分析，勿按常规节气年理解流年大运的交替规则。\n\n';
txt+='【基本信息】\n';
txt+=g+'命\n';
txt+=hourUnknown
  ? '出生：'+by+'-'+String(bm).padStart(2,'0')+'-'+String(bd).padStart(2,'0')+' 时辰未知\n'
  : '出生：'+by+'年'+bm+'月'+bd+'日 '+birthTimeStr+'\n';
txt+='八字：'+pillarStr+'\n';
txt+='纳音：'+nayinStr+'\n';
if(hourUnknown){
txt+='注意：此八字时辰未知（用户不确定出生时辰），时柱以"时辰未知"代替。\n';
txt+='大运起运时间通过遍历12个时辰取众数（按月取整）计算，已覆盖所有可能时辰的代表值。\n';
txt+='在分析过程中，请先尝试向用户询问过去具体发生的几件事情，反推可能的出生时辰，\n';
txt+='确认用户是否需要反推时辰，若用户确认，再根据反推结果重新校准大运流年。\n';
}
if(r.tai_yuan)txt+='胎元：'+r.tai_yuan+(r.tai_yuan_nayin?'（'+r.tai_yuan_nayin+'）':'')+'\n';
if(r.ming_gong)txt+='命宫：'+r.ming_gong+(r.ming_gong_nayin?'（'+r.ming_gong_nayin+'）':'')+'\n';
if(r.shen_gong)txt+='身宫：'+r.shen_gong+(r.shen_gong_nayin?'（'+r.shen_gong_nayin+'）':'')+'\n';
if(r.ri_kong)txt+='空亡：'+r.ri_kong+'\n';
if(r.jiao_yun_date)txt+='交运时间：'+r.jiao_yun_date+'\n';
if(r.qi_yun_info)txt+='起运：'+r.qi_yun_info+(hourUnknown?'（12时辰众数估算）':'')+'\n';
txt+='\n【大运时间表（含每一步内的全部流年）】\n'+dyLines;
txt+='\n【当前流年】'+curLnTxt+'\n';
if(curLyTxt)txt+='【当前月份】'+curLyTxt+'\n';
txt+='\n请使用禄命法以及子平法，综合看此八字。\n';
txt+='首先，请先询问我过去具体所发生的五件事情，校准模型。\n';
txt+='然后，询问我需要问什么问题。\n';
txt+='以上请用白话文直接询问。';
navigator.clipboard.writeText(txt).then(()=>{
const btn=document.getElementById('copyBtn');
const old=btn.textContent;btn.textContent='✅ 已复制';btn.style.borderColor='#060';btn.style.color='#060';
setTimeout(()=>{btn.textContent=old;btn.style.borderColor='';btn.style.color='';},2000);
}).catch(()=>alert('复制失败，请手动选择复制'));
}
</script>
</body>
</html>
